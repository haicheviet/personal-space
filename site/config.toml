baseURL = "http://haicheviet.com/"
# [en, zh-cn, fr, pl, ...] determines default content language
# [en, zh-cn, fr, pl, ...] 设置默认的语言
defaultContentLanguage = "en"
# theme
# 主题
theme = "personal-space"
# themes directory
# 主题目录
themesDir = "../.."

# website title
# 网站标题
title = "haicheBlog"

# whether to use robots.txt
# 是否使用 robots.txt
enableRobotsTXT = true
# whether to use git commit log
# 是否使用 git 信息
enableGitInfo = true
# whether to use emoji code
# 是否使用 emoji 代码
enableEmoji = true


[params]
  version = "2.0.X"
  defaultTheme = "auto"
  gitRepo = "https://github.com/HaiCheViet/personal-space"
  dateFormat = "2006-01-02"
  images = ["/logo.png"]
  newsletterSignup = "https://tinyletter.com/haiche"
  
  # Site description and keywords (Moved from languages.en.params)
  description = "About Hai Che Blog"
  keywords = ["data science", "blog", "hai che", "AI", "machine learning"]

  # Header config
  # 页面头部导航栏配置
  [params.header]
    # desktop header mode ("fixed", "normal", "auto")
    # 桌面端导航栏模式 ("fixed", "normal", "auto")
    desktopMode = "fixed"
    # mobile header mode ("fixed", "normal", "auto")
    # 移动端导航栏模式 ("fixed", "normal", "auto")
    mobileMode = "auto"
    # Header title config
    # 页面头部导航栏标题配置
    [params.header.title]
      # URL of the LOGO
      # LOGO 的 URL
      logo = ""
      # title name
      # 标题名称
      name = "HaiCheBlog"
      # you can add extra information before the name (HTML format is supported), such as icons
      # 你可以在名称 (允许 HTML 格式) 之前添加其他信息, 例如图标
      pre = "<i class='fas fa-pencil-alt fa-fw'></i>"
      # you can add extra information after the name (HTML format is supported), such as icons
      # 你可以在名称 (允许 HTML 格式) 之后添加其他信息, 例如图标
      post = ""

  [menu]
    [[menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 1
    [[menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 2
    [[menu.main]]
      identifier = "categories"
      name = "Categories"
      url = "/categories/"
      weight = 3
    [[menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 5
    [[menu.main]]
      identifier = "github"
      pre = "<i class='fab fa-github fa-fw'></i>"
      name = ""
      url = "https://github.com/haicheviet"
      title = "GitHub"
      weight = 6

  # Footer config
  # 页面底部信息配置
  [params.footer]
    enable = true
    # Custom content (HTML format is supported)
    # 自定义内容 (支持 HTML 格式)
    custom = ''
    # whether to show Hugo and theme info
    # 是否显示 Hugo 和主题信息
    hugo = true
    # whether to show copyright info
    # 是否显示版权信息
    copyright = true
    # whether to show the author
    # 是否显示作者
    author = true
    # site creation time
    # 网站创立年份
    since = 2022
    # ICP info only in China (HTML format is supported)
    # ICP 备案信息，仅在中国使用 (支持 HTML 格式)
    icp = ""
    # license info (HTML format is supported)

    license= '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # Section (all posts) page config
  [params.section]
    # special amount of posts in each section page
    # section 页面每页显示文章数量
    paginate = 20
    # date format (month and day)
    # 日期格式 (月和日)
    dateFormat = "01-02"
    # amount of RSS pages
    # RSS 文章数目
    rss = 10
  # Search config
  [params.search]
    enable = true
    type = "algolia"
    [params.search.algolia]
      index = "blog-index-en"
      appID = "ELSEOHI3SE"
      searchKey = "4057eb6a16fb0079e7879531d0e97b5c"

  # Home page config
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = "avatar.webp"
      title = "<video autoplay loop muted playsinline> <source src='introduction.webm' type='video/webm'> <source src='introduction.mp4' type='video/mp4'> </video>"
      social = true
    [params.home.posts]
      enable = true
      paginate = 6

  # List (category or tag) page config
  # List (目录或标签) 页面配置
  [params.list]
    # special amount of posts in each list page
    # list 页面每页显示文章数量
    paginate = 20
    # date format (month and day)
    # 日期格式 (月和日)
    dateFormat = "01-02"
    # amount of RSS pages
    # RSS 文章数目
    rss = 10

  # Social config
  [params.social]
    GitHub = "haicheviet"
    Linkedin = "hai-che"
    Twitter = "viet_che"
    Email = "cheviethai123@gmail.com"
    RSS = true
    [params.social.company]
      prefix = "https://www.koidra.ai/"

